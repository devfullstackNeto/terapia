services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terapia
      POSTGRES_USER: terapia
      POSTGRES_PASSWORD: terapia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terapia -d terapia"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://terapia:terapia@postgres:5432/terapia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-demo-secret-change-me
      CORS_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OLLAMA_HEALTH_TIMEOUT: ${OLLAMA_HEALTH_TIMEOUT:-1.5}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build: ./services/worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert pathlib.Path('/tmp/worker-ready').exists()"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["${WEB_PORT:-8088}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
